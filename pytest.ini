[pytest]
filterwarnings =
    # lark-o-api 1.7.1 bundles legacy protobuf code that still uses utcfromtimestamp.
    ignore:datetime\.datetime\.utcfromtimestamp\(\) is deprecated.*:DeprecationWarning:lark_oapi\.ws\.pb\.google\.protobuf\.internal\.well_known_types
    # lark-o-api 1.7.1 obtains an event loop during module import.
    ignore:There is no current event loop:DeprecationWarning:lark_oapi\.ws\.client
# Keep all pytest working files inside a project-local scratch dir so the
# real backend/data/ tree is never polluted by test runs.
addopts = -p no:cacheprovider --basetemp=.tmp_pytest
